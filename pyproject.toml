[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hora-panchanga-server"
version = "1.0.0"
description = "Offline Swiss Ephemeris-backed Hora and Panchanga REST API"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "Flask==3.1.3",
  "Flask-Caching==2.4.1",
  "Flask-Limiter==4.1.1",
  "pyswisseph==2.10.3.2",
  "timezonefinder==8.2.4",
  "tzdata==2026.2",
  "gunicorn==26.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[tool.setuptools.packages.find]
include = ["hora_server*"]

[tool.setuptools.package-data]
hora_server = ["ephe/*.se1"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
